<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split Image</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="controls">
      <label for="x">X:</label>
      <input type="number" id="x" min="1" value="5" max="100" />
      <label for="y">Y:</label>
      <input type="number" id="y" min="1" value="3" max="100" />
      <button id="splitButton">Split Image</button>
    </div>

    <div id="grid"><img src="./image.jpg" /></div>
    <script src="script.js"></script>
  </body>
</html>
